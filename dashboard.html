<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Data Hub 后台</title>
<style>
    :root {
        --bg: #f3f5f9;
        --card: #ffffff;
        --line: #e3e7ef;
        --text: #1a2233;
        --muted: #6b7688;
        --primary: #2563eb;
        --green: #16a34a;
        --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .view { max-width: 1080px; margin: 0 auto; }
    .hidden { display: none !important; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(16,24,40,0.05); }
    h1 { font-size: 1.25rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 0.8rem; color: var(--text); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    nav { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
    nav button {
        background: var(--card); color: var(--text); border: 1px solid var(--line);
        padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    nav button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    button {
        background: var(--primary); color: #fff; border: none; border-radius: 8px;
        padding: 0.55rem 1.1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #eef1f6; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 6px; }
    input {
        width: 100%; padding: 0.55rem 0.75rem; margin: 0.25rem 0 0.8rem;
        border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; font-family: inherit;
    }
    input:focus { border-color: var(--primary); outline: none; }
    input[type="checkbox"] { width: auto; margin-right: 0.4rem; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 0.2rem; }
    .toolbar { display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar label { margin: 0; }
    .toolbar input { width: 120px; margin: 0.2rem 0 0; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.4rem 1rem; align-items: end; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.5rem 0.6rem; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
    .status { margin-top: 0.7rem; font-weight: 600; min-height: 1.2em; font-size: 0.9rem; }
    .ok { color: var(--green); }
    .err { color: var(--red); }
    .center { max-width: 380px; margin: 10vh auto; text-align: center; }

    /* 统计卡片 */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; box-shadow: 0 1px 3px rgba(16,24,40,0.05); }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.2rem; }
    .stat-card .value.small { font-size: 1.05rem; }
    .stat-card.blue .value { color: var(--primary); }
    .stat-card.green .value { color: var(--green); }
    .stat-card.red .value { color: var(--red); }
    .bar { background: #eef1f6; border-radius: 5px; height: 10px; width: 100px; overflow: hidden; }
    .bar-fill { background: var(--primary); height: 100%; border-radius: 5px; min-width: 2px; }
</style>
</head>
<body>

<div id="loginView" class="view center">
    <div class="card">
        <h1>F1 Data Hub 后台</h1>
        <p style="color:var(--muted); font-size:0.9rem;">请输入管理员密码登录</p>
        <input type="password" id="password" placeholder="管理员密码" onkeypress="if(event.key==='Enter')login()">
        <button onclick="login()" style="width:100%;">登 录</button>
        <div class="status" id="loginStatus"></div>
    </div>
</div>

<div id="mainView" class="view hidden">
    <header>
        <h1>F1 Data Hub 后台</h1>
        <button class="secondary" onclick="logout()">退出登录</button>
    </header>

    <nav>
        <button class="tab active" data-tab="stats" onclick="showTab('stats')">数据统计</button>
        <button class="tab" data-tab="races" onclick="showTab('races')">赛程覆盖</button>
        <button class="tab" data-tab="bans" onclick="showTab('bans')">IP 封禁</button>
    </nav>

    <section id="tab-stats">
        <div class="cards">
            <div class="stat-card blue"><div class="label">今日访问</div><div class="value" id="stVisits">-</div></div>
            <div class="stat-card blue"><div class="label">今日 API 请求</div><div class="value" id="stApi">-</div></div>
            <div class="stat-card blue"><div class="label">今日 AI 请求</div><div class="value" id="stChat">-</div></div>
            <div class="stat-card green"><div class="label">今日 Tokens</div><div class="value" id="stTokens">-</div></div>
        </div>
        <div class="cards">
            <div class="stat-card"><div class="label">今日输入 Tokens</div><div class="value small" id="stPrompt">-</div></div>
            <div class="stat-card"><div class="label">今日输出 Tokens</div><div class="value small" id="stCompletion">-</div></div>
            <div class="stat-card red"><div class="label">近 14 天访问</div><div class="value small" id="stVisits14">-</div></div>
            <div class="stat-card red"><div class="label">近 14 天 AI 请求</div><div class="value small" id="stChat14">-</div></div>
        </div>
        <div class="card">
            <h2>近 14 天趋势</h2>
            <table>
                <thead><tr><th>日期</th><th>访问</th><th>API</th><th>AI</th><th>Tokens</th><th>访问趋势</th></tr></thead>
                <tbody id="statsTableBody"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-races" class="hidden">
        <div class="toolbar">
            <label>赛季年份
                <input type="text" id="year" value="2026">
            </label>
            <button onclick="loadRaces()">加载赛程</button>
        </div>
        <div class="card">
            <h2>添加 / 修改覆盖 <span id="raceCount"></span></h2>
            <div class="form-grid">
                <label>回合数<input type="text" id="round" placeholder="如 16"></label>
                <label>比赛名称<input type="text" id="raceName" placeholder="如 Sepang GP"></label>
                <label>赛道 ID<input type="text" id="circuitId" placeholder="如 sepang"></label>
                <label>赛道显示名称<input type="text" id="circuitName" placeholder="如 Sepang International Circuit"></label>
                <label>比赛日期<input type="date" id="date"></label>
                <label style="display:flex; align-items:center; margin-top:0.4rem;"><input type="checkbox" id="hasSprint"> 包含冲刺赛</label>
            </div>
            <button onclick="saveRace()">保存覆盖</button>
            <button class="secondary" onclick="clearForm()">清空表单</button>
            <div class="status" id="raceStatus"></div>
        </div>
        <div class="card">
            <h2>已保存的覆盖</h2>
            <table>
                <thead><tr><th>回合</th><th>比赛</th><th>赛道</th><th>日期</th><th>冲刺</th><th>操作</th></tr></thead>
                <tbody id="raceTable"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-bans" class="hidden">
        <div class="toolbar">
            <button onclick="loadBans()">刷新封禁列表</button>
        </div>
        <div class="card">
            <h2>被封禁的 IP（AI 高频访问）</h2>
            <table>
                <thead><tr><th>IP</th><th>封禁时间</th><th>操作</th></tr></thead>
                <tbody id="banTable"></tbody>
            </table>
            <div class="status" id="banStatus"></div>
        </div>
    </section>
</div>

<script>
const TOKEN_KEY = 'dashboard_token';

function showLogin() {
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('mainView').classList.add('hidden');
}

function showMain() {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden');
    loadStats().catch(() => {});
}

function logout() {
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin();
}

async function api(path, options = {}) {
    const token = sessionStorage.getItem(TOKEN_KEY);
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { ...options, headers });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        showLogin();
        throw new Error('登录已过期，请重新登录');
    }
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
}

async function login() {
    const password = document.getElementById('password').value;
    const status = document.getElementById('loginStatus');
    status.className = 'status';
    status.textContent = '登录中...';
    try {
        const res = await fetch('/api/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'login', password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '登录失败');
        sessionStorage.setItem(TOKEN_KEY, data.token);
        showMain();
    } catch (err) {
        status.className = 'status err';
        status.textContent = '❌ ' + err.message;
    }
}

function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('tab-stats').classList.toggle('hidden', name !== 'stats');
    document.getElementById('tab-races').classList.toggle('hidden', name !== 'races');
    document.getElementById('tab-bans').classList.toggle('hidden', name !== 'bans');
    if (name === 'stats') loadStats().catch(() => {});
    if (name === 'races') loadRaces().catch(() => {});
    if (name === 'bans') loadBans().catch(() => {});
}

function setStatus(id, msg, ok) {
    const el = document.getElementById(id);
    el.className = 'status ' + (ok ? 'ok' : 'err');
    el.textContent = (ok ? '✅ ' : '❌ ') + msg;
}

function setText(id, v) {
    document.getElementById(id).textContent = v;
}

function fmt(n) {
    return Number(n || 0).toLocaleString('en-US');
}

async function loadStats() {
    const data = await api('/api/stats');
    const t = data.today || {};
    const totals = data.totals || {};
    setText('stVisits', fmt(t.visits));
    setText('stApi', fmt(t.apiRequests));
    setText('stChat', fmt(t.chatRequests));
    setText('stTokens', fmt(t.totalTokens));
    setText('stPrompt', fmt(t.promptTokens));
    setText('stCompletion', fmt(t.completionTokens));
    setText('stVisits14', fmt(totals.visits));
    setText('stChat14', fmt(totals.chatRequests));
    renderStatsTable(data.days || []);
}

function renderStatsTable(days) {
    const tbody = document.getElementById('statsTableBody');
    tbody.innerHTML = '';
    const maxVisits = Math.max(1, ...days.map(d => d.visits || 0));
    days.forEach(d => {
        const tr = document.createElement('tr');
        [d.date, fmt(d.visits), fmt(d.apiRequests), fmt(d.chatRequests), fmt(d.totalTokens)].forEach(v => {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
        });
        const barTd = document.createElement('td');
        const wrap = document.createElement('div');
        wrap.className = 'bar';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = Math.round(((d.visits || 0) / maxVisits) * 100) + '%';
        wrap.appendChild(fill);
        barTd.appendChild(wrap);
        tr.appendChild(barTd);
        tbody.appendChild(tr);
    });
}

async function loadRaces() {
    const year = document.getElementById('year').value.trim();
    if (!/^\d{4}$/.test(year)) { setStatus('raceStatus', '年份格式应为四位数字', false); return; }
    const data = await api('/api/admin?year=' + encodeURIComponent(year));
    const tbody = document.getElementById('raceTable');
    tbody.innerHTML = '';
    document.getElementById('raceCount').textContent = '(' + data.races.length + ')';
    const sorted = data.races.slice().sort((a, b) => Number(a.round) - Number(b.round));
    sorted.forEach(r => {
        const tr = document.createElement('tr');
        [r.round, r.raceName, (r.Circuit && r.Circuit.circuitName) || '', r.date, r.Sprint ? '是' : '否'].forEach(v => {
            const td = document.createElement('td');
            td.textContent = v == null ? '' : v;
            tr.appendChild(td);
        });
        const opTd = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.className = 'secondary';
        editBtn.textContent = '编辑';
        editBtn.addEventListener('click', () => fillForm(r));
        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', () => deleteRace(r));
        opTd.appendChild(editBtn);
        opTd.appendChild(delBtn);
        tr.appendChild(opTd);
        tbody.appendChild(tr);
    });
}

function fillForm(r) {
    document.getElementById('round').value = r.round;
    document.getElementById('raceName').value = r.raceName || '';
    document.getElementById('circuitId').value = (r.Circuit && r.Circuit.circuitId) || '';
    document.getElementById('circuitName').value = (r.Circuit && r.Circuit.circuitName) || '';
    document.getElementById('date').value = r.date || '';
    document.getElementById('hasSprint').checked = !!r.Sprint;
}

function clearForm() {
    ['round', 'raceName', 'circuitId', 'circuitName', 'date'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('hasSprint').checked = false;
}

async function saveRace() {
    const payload = {
        year: document.getElementById('year').value.trim(),
        round: document.getElementById('round').value.trim(),
        raceName: document.getElementById('raceName').value.trim(),
        circuitId: document.getElementById('circuitId').value.trim(),
        circuitName: document.getElementById('circuitName').value.trim(),
        date: document.getElementById('date').value,
        hasSprint: document.getElementById('hasSprint').checked
    };
    if (!payload.year || !payload.round || !payload.raceName) {
        setStatus('raceStatus', '年份、回合、比赛名称为必填项', false);
        return;
    }
    try {
        await api('/api/admin', { method: 'POST', body: JSON.stringify(payload) });
        setStatus('raceStatus', '覆盖已保存', true);
        clearForm();
        await loadRaces();
    } catch (err) {
        setStatus('raceStatus', err.message, false);
    }
}

async function deleteRace(race) {
    if (!confirm('删除第 ' + race.round + ' 回合的覆盖？')) return;
    try {
        await api('/api/admin', {
            method: 'DELETE',
            body: JSON.stringify({ year: document.getElementById('year').value.trim(), round: race.round })
        });
        setStatus('raceStatus', '已删除', true);
        await loadRaces();
    } catch (err) {
        setStatus('raceStatus', err.message, false);
    }
}

async function loadBans() {
    const data = await api('/api/ban');
    const tbody = document.getElementById('banTable');
    tbody.innerHTML = '';
    data.bans.forEach(b => {
        const tr = document.createElement('tr');
        const ipTd = document.createElement('td');
        ipTd.textContent = b.ip;
        tr.appendChild(ipTd);
        const timeTd = document.createElement('td');
        timeTd.textContent = b.bannedAt ? new Date(Number(b.bannedAt)).toLocaleString() : '';
        tr.appendChild(timeTd);
        const opTd = document.createElement('td');
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = '解封';
        btn.addEventListener('click', () => unban(b.ip));
        opTd.appendChild(btn);
        tr.appendChild(opTd);
        tbody.appendChild(tr);
    });
}

async function unban(ip) {
    if (!confirm('解封 ' + ip + '？')) return;
    try {
        await api('/api/ban', { method: 'DELETE', body: JSON.stringify({ ip }) });
        setStatus('banStatus', '已解封 ' + ip, true);
        await loadBans();
    } catch (err) {
        setStatus('banStatus', err.message, false);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem(TOKEN_KEY)) showMain();
});
</script>
</body>
</html>
